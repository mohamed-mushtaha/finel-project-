[versions]
agp                  = "8.7.3"
kotlin               = "2.0.21"
ksp                  = "2.0.21-1.0.27"

# AndroidX core
coreKtx              = "1.15.0"
appcompat            = "1.7.0"
activity             = "1.9.3"
fragment             = "1.8.5"

# Lifecycle
lifecycle            = "2.8.7"

# UI
constraintlayout     = "2.2.0"
recyclerview         = "1.3.2"
cardview             = "1.0.0"
viewpager2           = "1.1.0"
swiperefresh         = "1.1.0"

# Material Design Components
material             = "1.12.0"

# Navigation Component
navigation           = "2.8.5"

# Hilt
hilt                 = "2.52"

# Coroutines
coroutines           = "1.9.0"

# Image loading
glide                = "4.16.0"

# Firebase
firebaseBom          = "33.7.0"
googleServices       = "4.4.2"

# Maps & Location
playServicesMaps     = "19.0.0"
playServicesLocation = "21.3.0"

# DataStore
datastore            = "1.1.1"

[libraries]
# Core
androidx-core-ktx              = { module = "androidx.core:core-ktx",               version.ref = "coreKtx" }
androidx-appcompat             = { module = "androidx.appcompat:appcompat",          version.ref = "appcompat" }
androidx-activity              = { module = "androidx.activity:activity-ktx",        version.ref = "activity" }
androidx-fragment              = { module = "androidx.fragment:fragment-ktx",        version.ref = "fragment" }

# Lifecycle
androidx-lifecycle-viewmodel   = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-livedata    = { module = "androidx.lifecycle:lifecycle-livedata-ktx",        version.ref = "lifecycle" }
androidx-lifecycle-runtime     = { module = "androidx.lifecycle:lifecycle-runtime-ktx",         version.ref = "lifecycle" }

# UI widgets
androidx-constraintlayout      = { module = "androidx.constraintlayout:constraintlayout",       version.ref = "constraintlayout" }
androidx-recyclerview          = { module = "androidx.recyclerview:recyclerview",               version.ref = "recyclerview" }
androidx-cardview              = { module = "androidx.cardview:cardview",                       version.ref = "cardview" }
androidx-viewpager2            = { module = "androidx.viewpager2:viewpager2",                   version.ref = "viewpager2" }
androidx-swiperefresh          = { module = "androidx.swiperefreshlayout:swiperefreshlayout",   version.ref = "swiperefresh" }

# Material
google-material                = { module = "com.google.android.material:material",             version.ref = "material" }

# Navigation
androidx-navigation-fragment   = { module = "androidx.navigation:navigation-fragment-ktx",     version.ref = "navigation" }
androidx-navigation-ui         = { module = "androidx.navigation:navigation-ui-ktx",           version.ref = "navigation" }

# Hilt
hilt-android                   = { module = "com.google.dagger:hilt-android",                  version.ref = "hilt" }
hilt-compiler                  = { module = "com.google.dagger:hilt-android-compiler",         version.ref = "hilt" }

# Coroutines
kotlinx-coroutines-android     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",       version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Glide
glide                          = { module = "com.github.bumptech.glide:glide",                 version.ref = "glide" }
glide-compiler                 = { module = "com.github.bumptech.glide:compiler",              version.ref = "glide" }

# Firebase
firebase-bom                   = { module = "com.google.firebase:firebase-bom",                version.ref = "firebaseBom" }
firebase-auth                  = { module = "com.google.firebase:firebase-auth-ktx" }
firebase-firestore             = { module = "com.google.firebase:firebase-firestore-ktx" }
firebase-analytics             = { module = "com.google.firebase:firebase-analytics-ktx" }

# Maps & Location
play-services-maps             = { module = "com.google.android.gms:play-services-maps",       version.ref = "playServicesMaps" }
play-services-location         = { module = "com.google.android.gms:play-services-location",   version.ref = "playServicesLocation" }

# DataStore
androidx-datastore             = { module = "androidx.datastore:datastore-preferences",        version.ref = "datastore" }

[plugins]
android-application  = { id = "com.android.application",              version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",          version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",               version.ref = "ksp" }
hilt-android         = { id = "com.google.dagger.hilt.android",        version.ref = "hilt" }
google-services      = { id = "com.google.gms.google-services",        version.ref = "googleServices" }
navigation-safeargs  = { id = "androidx.navigation.safeargs.kotlin",   version.ref = "navigation" }
